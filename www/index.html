<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<title>Workbench</title>
<style>
  :root {
    --bg: #f7f6f3;
    --fg: #1a1a18;
    --muted: #6b6a63;
    --rule: #d9d7d0;
    --accent: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --fg: #ececea;
      --muted: #9a9a94;
      --rule: #2e2e33;
      --accent: #f0a868;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
             max(1.5rem, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 30rem; }
  .tag {
    display: inline-block;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .75rem;
  }
  h1 {
    font-size: clamp(2.25rem, 12vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0 0 .75rem;
    font-weight: 650;
  }
  p { margin: 0 0 1.5rem; color: var(--muted); font-size: 1.05rem; }
  dl {
    margin: 0;
    border-top: 1px solid var(--rule);
    font-size: .95rem;
  }
  div.row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: .7rem 0;
    border-bottom: 1px solid var(--rule);
  }
  dt { color: var(--muted); margin: 0; }
  dd {
    margin: 0;
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .9rem;
    word-break: break-all;
  }
</style>
</head>
<body>
<main>
  <span class="tag">Placeholder</span>
  <h1>Workbench</h1>
  <p>
    Nothing is built yet. This page exists to prove the path from the home server
    to this screen &mdash; MagicDNS, HTTPS, and the tailnet &mdash; before any
    application depends on it.
  </p>
  <dl>
    <div class="row"><dt>Host</dt><dd>homebox-core</dd></div>
    <div class="row"><dt>Served by</dt><dd>tailscale serve</dd></div>
    <div class="row"><dt>Since</dt><dd>2026-08-12</dd></div>
  </dl>
</main>
</body>
</html>
