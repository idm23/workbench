<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="theme-color" content="#b45309">
<!-- iOS ignores the manifest's icons for "Add to Home Screen" and falls
     back to a plain initial on a gray tile without this tag — this is the
     one that actually fixes that. The SVG + sized PNGs below are for
     everything else: desktop tab favicons, bookmarks, and Android/desktop
     "install as app". -->
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>{% block title %}Workbench{% endblock %}</title>
<style>
  /* One scale for each of spacing, type and radius. A value that is not on
     one of these is a decision somebody made once and nobody else can see,
     which is how a page ends up looking assembled rather than designed. */
  :root {
    --space-1: .25rem;
    --space-2: .5rem;
    --space-3: .75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.75rem;
    --space-7: 2.5rem;

    /* 2xs is for uppercase eyebrow labels only; running text starts at xs. */
    --text-2xs: .72rem;
    --text-xs: .85rem;
    --text-sm: .92rem;
    --text-md: 1rem;

    --radius-sm: .55rem;
    --radius-md: .75rem;
    --radius-lg: .9rem;
  }
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --panel-2: #faf8f4;
    --fg: #1a1a18;
    --muted: #6b6a63;
    --rule: #e2dfd5;
    --accent: #b45309;
    --accent-fg: #fffaf5;
    --success: #2f7a4d;
    --danger: #a02c2c;
    --danger-bg: #fbeaea;
    --notice-bg: #fdf3e3;
    --shadow: rgba(30, 26, 15, .08);
    --shadow-soft: rgba(30, 26, 15, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131315;
      --panel: #1e1e22;
      --panel-2: #202126;
      --fg: #ececea;
      --muted: #9a9a94;
      --rule: #303035;
      --accent: #f0a868;
      --accent-fg: #1c1206;
      --success: #6cc38f;
      --danger: #f08a8a;
      --danger-bg: #331e1e;
      --notice-bg: #33291a;
      --shadow: rgba(0, 0, 0, .5);
      --shadow-soft: rgba(0, 0, 0, .32);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    /* A faint wash rather than a flat fill — decorative only, and invalid
       (ignored) on a browser without color-mix() support, which just leaves
       the plain background colour. */
    background-image: radial-gradient(
      ellipse 60% 32rem at 20% -8rem,
      color-mix(in srgb, var(--accent) 9%, transparent),
      transparent 65%
    );
    background-repeat: no-repeat;
    color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 38rem;
    margin: 0 auto;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem
             max(2rem, env(safe-area-inset-bottom));
  }
  a { color: inherit; }
  .back {
    display: inline-flex;
    align-items: center;
    color: var(--muted);
    text-decoration: none;
    font-size: var(--text-sm);
    margin-bottom: var(--space-5);
    transition: color .15s ease, transform .15s ease;
  }
  .back:hover { color: var(--accent); transform: translateX(-2px); }
  h1 {
    font-size: clamp(1.75rem, 8vw, 2.5rem);
    line-height: 1.08;
    letter-spacing: -0.025em;
    margin: 0 0 var(--space-2);
    font-weight: 750;
  }
  .sub { color: var(--muted); margin: 0 0 var(--space-6); font-size: var(--text-sm); }

  .msg {
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-5);
    font-size: var(--text-sm);
    border-left: 3px solid transparent;
    box-shadow: 0 1px 2px var(--shadow-soft);
  }
  .msg.error { background: var(--danger-bg); color: var(--danger); border-left-color: var(--danger); }
  .msg.notice { background: var(--notice-bg); border-left-color: var(--accent); }

  /* Every row and task in the app lives in its own card rather than behind a
     divider — the `.row`/subtask `<li>` below fills its parent's padding box
     exactly (see the negative margin), so hovering the link and hovering the
     card are the same event and need no extra selector to keep in sync. */
  ul.items { list-style: none; margin: 0 0 var(--space-6); padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
  ul.items li {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-4);
    box-shadow: 0 1px 2px var(--shadow-soft);
    overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  ul.items li:hover { border-color: var(--accent); box-shadow: 0 4px 12px var(--shadow); transform: translateY(-1px); }
  .row {
    display: block;
    margin: calc(-1 * var(--space-4)) calc(-1 * var(--space-4));
    padding: var(--space-4) var(--space-4);
    text-decoration: none;
    color: inherit;
  }
  .row-title {
    font-weight: 650;
    display: flex;
    justify-content: space-between;
    gap: var(--space-4);
    align-items: baseline;
  }
  .row-meta { color: var(--muted); font-size: var(--text-sm); margin-top: var(--space-1); }
  .chev { color: var(--muted); font-weight: 400; display: inline-block; transition: transform .15s ease, color .15s ease; }
  ul.items li:hover .chev { transform: translateX(2px); color: var(--accent); }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--text-xs);
  }
  .badge {
    display: inline-block;
    font-size: var(--text-2xs);
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: .1rem var(--space-3);
    margin-top: var(--space-2);
  }
  .empty {
    color: var(--muted);
    border: 1.5px dashed var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-6) var(--space-5);
    text-align: center;
    margin-bottom: var(--space-6);
    font-size: var(--text-sm);
    background: var(--panel-2);
  }

  form { border-top: 1px solid var(--rule); padding-top: var(--space-5); }
  label {
    display: block;
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: var(--space-2);
  }
  input[type=text], textarea, select {
    width: 100%;
    padding: var(--space-3) var(--space-4);
    font: inherit;
    font-size: var(--text-md); /* 16px minimum, or iOS zooms on focus */
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-3);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .hint { color: var(--muted); font-size: var(--text-xs); margin: calc(-1 * var(--space-2)) 0 var(--space-3); }
  textarea { resize: vertical; }
  button {
    width: 100%;
    min-height: 2.9rem; /* comfortable tap target */
    padding: var(--space-3) var(--space-4);
    font-size: var(--text-md);
    font-weight: 650;
    color: var(--accent-fg);
    background: var(--accent);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 35%, transparent);
    transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover { box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 45%, transparent); }
  button:active { transform: translateY(1px) scale(.99); opacity: .92; }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--rule);
    box-shadow: none;
  }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
  /* Reserved for the one truly irreversible action (deleting a task) — every
     other "stop" or "discard" button stays a plain secondary, since undoing
     those is just starting again. */
  button.danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--rule));
    box-shadow: none;
  }
  button.danger:hover { background: var(--danger-bg); border-color: var(--danger); box-shadow: none; }
  /* Pressed and waiting for the next page. Every action is a form POST that
     returns a whole page, and on a phone that gap reads as "did that
     register?" — see the submit listener at the bottom of this file. */
  button[aria-busy="true"] {
    cursor: progress;
    opacity: .6;
    transform: none;
    animation: pressed 1.2s ease-in-out infinite;
  }
  @keyframes pressed {
    0%, 100% { opacity: .65; }
    50% { opacity: .4; }
  }
  @media (prefers-reduced-motion: reduce) {
    button[aria-busy="true"] { animation: none; }
  }
  button.slim { width: auto; min-height: 2.3rem; padding: var(--space-2) var(--space-4); font-size: var(--text-xs); border-radius: var(--radius-sm); }
  /* A link styled to sit in the same action row as the slim buttons above —
     "View PR" leaves the app, so it is an <a> rather than a form button, but
     it should not look like a different kind of control for that reason. */
  a.slim {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: auto;
    min-height: 2.3rem;
    padding: var(--space-2) var(--space-4);
    font-size: var(--text-xs);
    font-weight: 650;
    border-radius: var(--radius-sm);
    text-decoration: none;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--rule);
    transition: border-color .15s ease, color .15s ease;
  }
  a.slim:hover { border-color: var(--accent); color: var(--accent); }
  /* The quietest button: no fill and no border until it is pointed at. For
     controls that open something rather than do something — the "…" on a
     task row, and the items in the menu it opens. */
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    box-shadow: none;
  }
  button.ghost:hover { color: var(--accent); border-color: var(--rule); box-shadow: none; }
  button.more { min-width: 2.3rem; padding-inline: var(--space-3); font-size: var(--text-md); letter-spacing: .08em; }

  /* One focus ring for everything a keyboard can reach. Inputs keep their own
     glow below, which wins on specificity; this is for the controls that had
     nothing but the browser default, which on a coloured button is often
     invisible. */
  :where(button, a, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* A task row's "…" menu. A native popover: the top layer, light dismiss
     and Escape come from the browser. Anchored under its button where anchor
     positioning exists, flipping when there is no room; elsewhere the UA
     centres it, which on a phone reads as a small sheet and is fine. */
  .menu {
    min-width: 12rem;
    max-width: calc(100vw - 2 * var(--space-4));
    padding: var(--space-1);
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    background: var(--panel);
    color: var(--fg);
    box-shadow: 0 8px 24px var(--shadow);
  }
  @supports (position-anchor: --a) {
    .menu {
      inset: auto;
      margin: var(--space-1) 0 0;
      position-area: bottom span-left;
      position-try-fallbacks: flip-block, flip-inline, flip-block flip-inline;
    }
  }
  .menu form { border: none; padding: 0; margin: 0; }
  .menu button, .menu a.slim {
    display: flex;
    width: 100%;
    justify-content: flex-start;
    text-align: left;
    background: transparent;
    color: var(--fg);
    border: none;
    box-shadow: none;
    border-radius: var(--radius-sm);
  }
  .menu button:hover, .menu a.slim:hover { background: var(--panel-2); color: var(--accent); box-shadow: none; }
  .menu button.danger { color: var(--danger); }
  .menu button.danger:hover { background: var(--danger-bg); color: var(--danger); }

  /* The task tree. Indentation is a left margin driven by depth rather than
     nested <ul>s, so the template iterates one flat list and there is no
     recursive Jinja macro to read — collapsing (see the page's own script)
     works the same way, by hiding a contiguous run of later list items
     rather than by hiding a DOM subtree. */
  ul.tree { list-style: none; margin: 0 0 var(--space-6); padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
  /* A thin guide line at the parent's own indent level, so a nested task
     visibly branches from something rather than just sitting further right.
     `--depth` is set inline alongside the padding it already needs. */
  ul.tree li[data-depth]:not([data-depth="0"]) { position: relative; }
  ul.tree li[data-depth]:not([data-depth="0"])::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: -.6rem;
    left: calc(1.25rem * (var(--depth) - 1) + .7rem);
    width: 2px;
    background: var(--rule);
  }
  ul.tree li[data-depth]:not([data-depth="0"]):last-child::before { bottom: 0; }
  .task {
    display: flex;
    gap: var(--space-3);
    align-items: flex-start;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-4);
    box-shadow: 0 1px 2px var(--shadow-soft);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  /* A parent describes work rather than being work, so it reads as a
     quieter container rather than another actionable card. */
  .task.parent { background: var(--panel-2); }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-weight: 650; overflow-wrap: anywhere; }
  .task.done { opacity: .72; }
  .task.done .task-title { color: var(--muted); text-decoration: line-through; }
  .task-note { color: var(--muted); font-size: var(--text-sm); margin-top: .15rem; }
  /* A folded body: the disclosure triangle is replaced with a "more"/"less"
     word, since the triangle alone reads as a bullet on a phone rather than
     as something to tap. */
  .task-note summary { cursor: pointer; list-style: none; }
  .task-note summary::-webkit-details-marker { display: none; }
  .task-note summary::after { content: "more"; color: var(--accent); font-weight: 600; margin-left: var(--space-1); }
  .task-note[open] summary::after { content: "less"; }
  .task-note-rest { margin-top: var(--space-1); }
  .task-body .meter { max-width: 12rem; margin-top: var(--space-2); }
  .task-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .task-actions form { border: none; padding: 0; margin: 0; }
  /* A select sizes itself to its longest option, and a branch list can hold
     a long one: without these the row, and then the page, scrolled sideways
     on a phone. */
  .task-actions form { max-width: 100%; min-width: 0; }
  .task-actions select { max-width: 100%; }
  /* A row whose only actions are in its menu gets no empty action strip. */
  .task-actions:not(:has(*)) { display: none; }
  /* The row's "…" sits in the card's top-right corner, level with the title,
     so it costs no height of its own. */
  .task > .more { flex: 0 0 auto; min-height: 2rem; margin: calc(-1 * var(--space-1)) calc(-1 * var(--space-2)) 0 0; }

  /* The Discuss dialog on a run's page — the one place this app opens a real
     modal rather than a plain form. A native <dialog> rather than anything
     hand-rolled: it gets focus-trapping, Escape-to-close, and a backdrop for
     free, and needs only `showModal()`/`close()` to drive, in keeping with
     the rest of the app's small, framework-free scripts. */
  dialog {
    width: min(28rem, 90vw);
    padding: var(--space-5);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    background: var(--panel);
    color: var(--fg);
    box-shadow: 0 8px 24px var(--shadow-soft);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog form { border: none; padding: 0; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
  .dialog-actions button { width: auto; min-height: 2.3rem; padding: var(--space-2) var(--space-4); font-size: var(--text-xs); border-radius: var(--radius-sm); }
  /* A run in flight gets a warm border rather than only the pip inside —
     legible even to someone scanning the whole tree at a glance. */
  .task.busy {
    border-color: color-mix(in srgb, var(--accent) 40%, var(--rule));
    box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .task.busy .task-title { font-weight: 700; }

  /* Collapses a parent's whole subtree — sized like `.tick` since it sits
     right next to it, but a plain chevron rather than a filled control,
     since it changes what is visible rather than the task itself. */
  .twist {
    appearance: none;
    flex: 0 0 auto;
    width: 1.5rem; height: 1.5rem;
    margin-top: .05rem;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 0;
    min-height: 0;
    box-shadow: none;
    transform: rotate(90deg);
    transition: transform .15s ease, color .15s ease;
  }
  .twist:hover { color: var(--accent); }
  .twist[aria-expanded="false"] { transform: rotate(0deg); }

  /* A checkbox that posts a form. Sized as a tap target first: this is the
     control used most often, and always from a phone. Circular rather than
     square, so a filled one reads as a checkmark rather than a filled
     square. */
  .tick {
    appearance: none;
    flex: 0 0 auto;
    width: 1.5rem; height: 1.5rem;
    margin-top: .05rem;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    font-size: var(--text-xs);
    line-height: 1;
    color: var(--fg);
    padding: 0;
    min-height: 0;
    box-shadow: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .tick:hover { border-color: var(--accent); }
  .tick.checked { background: var(--success); border-color: var(--success); color: var(--accent-fg); }

  /* Filled, tinted badges rather than outlined ones. The dot inherits
     `color` via `currentColor`, so a status only ever has to say its color
     once and the dot and the text stay in sync automatically. */
  .status {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--text-2xs);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    border-radius: 999px;
    padding: .2rem var(--space-3);
    color: var(--muted);
    background: color-mix(in srgb, var(--muted) 14%, var(--panel));
  }
  .status.active, .status.live, .status.running {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, var(--panel));
  }
  .status.blocked, .status.cancelled, .status.failed {
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 16%, var(--panel));
  }
  .status.done, .status.succeeded {
    color: var(--success);
    background: color-mix(in srgb, var(--success) 18%, var(--panel));
  }
  .status.review { color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, var(--panel)); }

  /* A task an agent is working on. The dot carries the meaning at a glance
     and the label carries it for anyone the colour does not reach. */
  .pip {
    flex: 0 0 auto;
    width: .5rem;
    height: .5rem;
    border-radius: 999px;
    background: currentColor;
    display: inline-block;
    vertical-align: middle;
  }
  .status.live .pip { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }
  /* Someone who has asked for less motion still gets the dot and the label. */
  @media (prefers-reduced-motion: reduce) {
    .status.live .pip { animation: none; }
  }

  /* The project's own standing conversation. Sized and coloured like the
     primary button it stands in for, not like the small activity pill a
     task's own busy marker uses — this is the one action on the page, not
     a status report. */
  .conversation-banner {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    text-decoration: none;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule));
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-4);
    font-weight: 650;
    margin-bottom: var(--space-6);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .conversation-banner:hover { box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent); transform: translateY(-1px); }
  .conversation-banner .pip { animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .conversation-banner .pip { animation: none; }
  }

  /* Setup warnings. Above the rate-limit panel deliberately: a window that is
     80% spent still lets an agent run, and a backend with no credential does
     not — so a setup problem outranks a usage gauge. Two states rather than
     one, because "nobody can reach this from a phone" and "no agent can run"
     are not the same size of problem. */
  .setup { margin-bottom: var(--space-5); }
  .setup-item {
    border: 1px solid var(--rule);
    border-left-width: 3px;
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-3);
    margin-bottom: var(--space-3);
    box-shadow: 0 1px 2px var(--shadow-soft);
  }
  .setup-item.urgent { border-left-color: var(--danger); background: var(--danger-bg); }
  .setup-item.todo { border-left-color: var(--muted); background: var(--notice-bg); }
  .setup-title { font-weight: 650; }
  .setup-item.urgent .setup-title { color: var(--danger); }
  .setup-detail {
    color: var(--muted);
    font-size: var(--text-xs);
    margin-top: .15rem;
    /* Details carry newlines — a deploy key's is a pasteable public half. */
    white-space: pre-wrap;
  }
  .setup-fix {
    margin-top: var(--space-2);
    font-size: var(--text-xs);
    /* Long commands scroll rather than widening the page. A body that scrolls
       sideways on a phone is the one layout failure that ruins every page. */
    overflow-x: auto;
    white-space: nowrap;
  }

  /* Rate limits. Runs bill a subscription, so a window is the thing that
     actually runs out — and it is shared with everything else on the account,
     which is why this sits on every page rather than on a run's own. */
  .limits {
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-5);
    background: var(--panel);
    box-shadow: 0 1px 2px var(--shadow-soft);
  }
  .limits-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-3);
    font-size: var(--text-2xs);
    text-transform: uppercase;
    letter-spacing: .07em;
    font-weight: 700;
    color: var(--muted);
  }
  .limits-empty { color: var(--muted); font-size: var(--text-xs); margin: var(--space-2) 0 0; }
  .limit { margin-top: var(--space-2); }
  .limit-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--space-3);
    font-size: var(--text-xs);
  }
  .limit-name { color: var(--fg); }
  .limit-meta { color: var(--muted); font-size: var(--text-xs); white-space: nowrap; }
  /* A meter rather than a progress bar: this is a measurement against a known
     maximum, not a task advancing, and screen readers say so. */
  .meter {
    display: block;
    width: 100%;
    height: .4rem;
    margin-top: var(--space-1);
    border-radius: 999px;
    background: var(--rule);
    overflow: hidden;
  }
  .meter > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--muted);
  }
  .limit.warning .meter > span { background: var(--accent); }
  .limit.warning .limit-meta { color: var(--accent); }
  .limit.exhausted .meter > span { background: var(--danger); }
  .limit.exhausted .limit-meta { color: var(--danger); font-weight: 650; }

  /* A run's page: metadata, then the event log as it arrives. */
  h2.section {
    font-size: var(--text-2xs);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    font-weight: 700;
    margin: var(--space-7) 0 var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .run-meta {
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-1) var(--space-4);
    margin-bottom: var(--space-5);
    background: var(--panel);
    box-shadow: 0 1px 2px var(--shadow-soft);
  }
  .run-meta > div {
    display: flex;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-2) 0;
    font-size: var(--text-sm);
    border-top: 1px solid var(--rule);
    overflow-wrap: anywhere;
  }
  .run-meta > div:first-child { border-top: none; }
  .run-meta span:first-child { color: var(--muted); flex: 0 0 auto; }
  .block {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-4);
    margin: 0 0 var(--space-5);
    font-size: var(--text-xs);
    line-height: 1.5;
    box-shadow: 0 1px 2px var(--shadow-soft);
    /* Long tool output and diffstats scroll inside their own box rather than
       making the whole page scroll sideways on a phone. */
    overflow-x: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* Rendered Markdown — a run's plan, summary, and its own prose events, via
     the `markdown` Jinja filter (see rendering.py). Layered onto `.block` or
     `.ev-body`, both of which set `white-space: pre-wrap` for the plain text
     they show elsewhere (a diffstat, a tool result); this rule has to win
     that fight, since HTML already carries its own line breaks and
     preserving the source's whitespace on top would double them up. Beyond
     that this borrows the page's existing rhythm — heading weight, muted
     code background — rather than a separate typographic scale, since
     nothing rendered here is more than a few paragraphs long. */
  .prose { white-space: normal; }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose blockquote, .prose pre { margin: 0 0 .75em; }
  .prose ul, .prose ol { padding-left: 1.3em; }
  .prose li + li { margin-top: .25em; }
  .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
    margin: 1em 0 .4em;
    font-weight: 700;
    line-height: 1.25;
  }
  .prose h1 { font-size: 1.3em; }
  .prose h2 { font-size: 1.15em; }
  .prose h3, .prose h4, .prose h5, .prose h6 { font-size: 1.05em; }
  .prose code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .9em;
    background: var(--panel-2);
    border-radius: .3em;
    padding: .1em .35em;
  }
  .prose pre {
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: .6em;
    padding: .7em .85em;
    overflow-x: auto;
  }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote {
    border-left: 3px solid var(--rule);
    padding-left: .85em;
    color: var(--muted);
  }
  .prose a { color: var(--accent); text-decoration: underline; text-underline-offset: .15em; }
  .prose hr { border: none; border-top: 1px solid var(--rule); margin: 1em 0; }

  /* Folding a long plan or task body on the tree.

     The whole document is rendered and then *clipped*, rather than the text
     being cut in two and each half rendered separately — Markdown split at a
     character offset is two invalid documents (a fence opened in one half and
     closed in the other), which is what this replaced.

     `<details>` normally shows nothing but its `<summary>` when closed. The
     `display: block` below overrides that so a few lines stay visible as a
     peek, with a mask fading them out. If a browser refuses the override the
     result is a plain `<details>`: the peek is gone, the toggle still opens
     the full plan. Degraded, never broken — which is why the summary carries
     its own label rather than relying on the peek to say what it is. */
  .foldable { margin-top: var(--space-2); }
  .foldable > summary {
    cursor: pointer;
    list-style: none;
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--accent);
    /* Above the fading peek, which is pulled up underneath it. */
    position: relative;
    z-index: 1;
  }
  .foldable > summary::-webkit-details-marker { display: none; }
  .foldable > summary::after { content: "show more"; }
  .foldable[open] > summary::after { content: "show less"; }
  .foldable > .prose { display: block; }
  .foldable:not([open]) > .prose {
    max-height: 4.5em;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 45%, transparent 100%);
  }
  /* The peek reads as the thing being disclosed, so it sits above the
     toggle; source order keeps <summary> first, as the element requires. */
  .foldable > .prose { order: -1; }
  .foldable { display: flex; flex-direction: column; }

  /* The event log, as a stack of cards rather than a divided list — closer
     to a chat transcript, which is what a project conversation actually is.
     The left border is each kind's whole identity; the background only
     lifts `text` and `input` slightly above the rest, since those are what a
     person actually reads and everything else is supporting detail. */
  ul.events { list-style: none; margin: 0 0 var(--space-6); padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .ev {
    display: flex;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-3);
    border-radius: var(--radius-md);
    border-left: 3px solid var(--rule);
    background: var(--panel-2);
    font-size: var(--text-sm);
  }
  .ev-kind {
    flex: 0 0 5.6rem; /* fits TOOL_RESULT at --text-2xs */
    font-size: var(--text-2xs);
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    color: var(--muted);
    padding-top: .2rem;
  }
  .ev-body { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  .ev.text { background: var(--panel); border-left-color: var(--accent); }
  /* Reasoning and tool plumbing are dimmed: they are worth being able to read
     but should not compete with what the agent actually said. */
  .ev.thinking .ev-body, .ev.tool_result .ev-body, .ev.notice .ev-body { color: var(--muted); }
  .ev.tool_use { border-left-color: var(--fg); }
  .ev.tool_use .ev-body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: var(--text-xs); }
  .ev.status { border-left-color: var(--accent); }
  .ev.status .ev-kind { color: var(--accent); }
  /* What a person typed in, set apart so a conversation does not read as
     one-sided. */
  .ev.input { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border-left-color: var(--accent); }
  .ev.input .ev-kind { color: var(--accent); }
  .ev.input .ev-body { font-weight: 650; color: var(--fg); }

  .live-dot { font-size: var(--text-2xs); letter-spacing: .06em; color: var(--accent); font-weight: 700; }
  .live-dot.on::before {
    content: "";
    display: inline-block;
    width: .4rem; height: .4rem;
    border-radius: 999px;
    background: var(--accent);
    margin-right: var(--space-1);
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot.on::before { animation: none; }
  }
  /* Same-origin navigations animate instead of flashing, so approving a plan
     reads as a state change rather than a page load. Browsers without it
     (Firefox, for now) get exactly the old behaviour. Task rows carry their
     own `view-transition-name` in project_detail.html so they keep their
     identity across the navigation rather than the whole page cross-fading. */
  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; }
    ::view-transition-group(*) { animation-duration: .18s; }
  }
</style>
</head>
<body>
<div class="wrap">
  {% block back %}{% endblock %}
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  {% if notice %}<p class="msg notice">{{ notice }}</p>{% endif %}
  {% if warnings %}{% include "_setup_warnings.html" %}{% endif %}
  {% include "_rate_limits.html" %}
  {% block content %}{% endblock %}
</div>
<script>
  // Every mutating action on this app is a plain <form method="post"> whose
  // route ends the request with a 303 redirect back to the same page (see
  // `_redirect` in app.py) — a fresh top-level GET, which means the browser
  // has no scroll position of its own to restore. This restores one by hand,
  // keyed on the path a form was submitted from and read back on the next
  // load of that same path.
  //
  // Global (not page-specific) because the same POST/redirect/GET pattern is
  // used by every form in the app, not just the task tree.
  (function () {
    history.scrollRestoration = "manual";

    document.addEventListener("submit", function (event) {
      // The query string is excluded on purpose: `_redirect` appends
      // `?notice=...`/`?error=...` to the same path the form was on, and the
      // saved offset should still be found when that lands back here.
      sessionStorage.setItem("scrollY:" + location.pathname, String(window.scrollY));
      markBusy(event);
    });

    // Acknowledge the press now, rather than when the next page arrives.
    // `aria-busy` rather than `disabled`: the entry list is built *after* the
    // submit event, and a disabled submitter would drop its own name/value
    // from it. A second submit of the same form is refused instead, which is
    // the other thing `disabled` would have bought.
    function markBusy(event) {
      var form = event.target;
      if (event.defaultPrevented) return;
      if (form.dataset.busy) { event.preventDefault(); return; }
      form.dataset.busy = "1";
      var button = event.submitter || form.querySelector('button[type="submit"], button:not([type])');
      if (button) button.setAttribute("aria-busy", "true");
      // A navigation that never lands — stopped, or dropped offline — fires
      // nothing on this page, so give the button back rather than leave a dead
      // row. Long enough that a slow success does not flicker back first.
      window.setTimeout(function () { release(form); }, 15000);
    }

    function release(form) {
      delete form.dataset.busy;
      form.querySelectorAll('[aria-busy="true"]').forEach(function (button) {
        button.removeAttribute("aria-busy");
      });
    }

    // Coming back with the back button can restore this page from the
    // back/forward cache exactly as it was left: mid-press.
    window.addEventListener("pageshow", function (event) {
      if (event.persisted) document.querySelectorAll("form[data-busy]").forEach(release);
    });

    var key = "scrollY:" + location.pathname;
    var saved = sessionStorage.getItem(key);
    if (saved !== null) {
      // Removed immediately so a later, unrelated visit to the same path
      // (not preceded by a form submit) doesn't reuse a stale offset.
      sessionStorage.removeItem(key);
      window.scrollTo(0, Number(saved));
    }
  })();
</script>
</body>
</html>
