[project]
name = "workbench"
version = "0.1.0"
description = "Manage software projects on a home server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    # Required by FastAPI to read form submissions. Omitting it makes every
    # form POST fail with an opaque 400 rather than a missing-dependency error.
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.52",
    # Plain uvicorn, not uvicorn[standard]: the extra pulls compiled uvloop and
    # httptools, the most likely things to lack a wheel on a new Python, for no
    # benefit at this scale.
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
