name: CI

on:
  push:
    # staging as well as main: a commit has to be green on staging before it is
    # a candidate for main, and the branch protection on main requires these
    # same checks to have run.
    branches: [main, staging]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch version, unlike checkout above: setup-uv
      # stopped publishing floating major tags after v7, so `@v10` does not
      # resolve. Bump this deliberately.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # uv reads .python-version and fetches that interpreter itself, so the
      # runner's system Python is irrelevant — the same version runs here, on
      # the laptop, and on the server.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest -q

      # install.sh is the only shell left in the repo, and the one file we are
      # least equipped to review by eye. shellcheck is preinstalled on GitHub's
      # Ubuntu runners.
      - name: Shell bootstrap
        run: shellcheck install.sh

      - name: Migrations
        # `alembic check` fails when the models have drifted from the
        # migrations — someone changed a column and did not generate a
        # revision. That mistake is invisible locally, because the developer's
        # database already has the change applied by hand.
        run: |
          uv run alembic upgrade head
          uv run alembic check

  fresh-install:
    name: Fresh install on clean Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch version, unlike checkout above: setup-uv
      # stopped publishing floating major tags after v7, so `@v10` does not
      # resolve. Bump this deliberately.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Provisions a clean Ubuntu container, runs install.sh inside it, drives
      # the app over HTTP, then re-runs the install to prove it repeats. This
      # is what keeps the "clone it and run one command" claim honest: a setup
      # step that creeps outside install.sh fails here.
      #
      # The smoke test calls the public GitHub API unauthenticated. That is
      # rate limited per IP and runner IPs are shared, so a "GitHub metadata
      # unavailable" note in the log is expected — the app treats it as a
      # degrade rather than a failure, and exercising that path is a pass.
      - name: Clean-machine install
        run: uv run scripts/test_fresh_install.py

  deploy-cycle:
    name: Deploy cycle on systemd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch version, unlike checkout above: setup-uv
      # stopped publishing floating major tags after v7, so `@v10` does not
      # resolve. Bump this deliberately.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The deployer runs as root under systemd, where PATH is minimal, so it
      # looks for uv at ~<owner>/.local/bin/uv before falling back to PATH.
      # setup-uv puts it in the tool cache instead, which root would never find.
      - name: Put uv where the deployer looks for it
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v uv)" "$HOME/.local/bin/uv"

      # The only test that exercises systemd at all. The container-based
      # fresh-install test skips units entirely because containers have no
      # systemd, which leaves the units, the timer, and the whole of
      # rebuild_and_restart() otherwise unexecuted until they run on the
      # server. Runners are disposable VMs with systemd and passwordless sudo,
      # so this installs real units and removes them again.
      - name: Deploy cycle
        run: uv run scripts/test_deploy_cycle.py

      # The script dumps both units itself, but it tears them down afterwards.
      # This catches anything that killed it before it got that far.
      - name: Journals on failure
        if: failure()
        run: |
          sudo journalctl -u workbench-citest -n 200 --no-pager || true
          sudo journalctl -u workbench-citest-deploy -n 200 --no-pager || true
