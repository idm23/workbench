# Alembic configuration.
#
# Note there is no sqlalchemy.url here on purpose: alembic/env.py takes it from
# workbench.config so the application and the migrations can never disagree
# about which database they are pointed at.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Date-prefixed so versions/ sorts chronologically when read by a human.
# Alembic still resolves order from the revision graph, not the filename.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic,alembic_plugins

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# `alembic check` announces every autogenerate plugin it loads, at INFO. That
# is seven lines per invocation and the deployer runs it twice per deploy, so
# the journal — the one place a bad deploy explains itself — fills with noise
# that has never once been useful.
[logger_alembic_plugins]
level = WARNING
handlers =
qualname = alembic.runtime.plugins

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
