[project]
name = "workbench"
version = "0.1.0"
description = "Manage software projects on a home server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    # Required by FastAPI to read form submissions. Omitting it makes every
    # form POST fail with an opaque 400 rather than a missing-dependency error.
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.52",
    # Plain uvicorn, not uvicorn[standard]: the extra pulls compiled uvloop and
    # httptools, the most likely things to lack a wheel on a new Python, for no
    # benefit at this scale.
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
# Tests live beside the code they cover, which puts them inside the package.
# Without this they would be built into the wheel and installed onto the
# server — and pytest could then collect them from the virtualenv as well as
# from the source tree.
exclude = ["**/tests"]

[tool.pytest.ini_options]
# Two roots: the ones beside their code, and the ones with no single module to
# sit next to. test_deploy and test_units cover behaviour that spans install,
# config, and the unit templates together.
testpaths = ["src/workbench", "tests"]

[tool.ruff]
target-version = "py314"
# 88 is ruff's default and is tight for this code; 100 keeps the prose-style
# comments and SQLAlchemy declarations readable without wrapping mid-thought.
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # pep8 naming
    "UP",      # pyupgrade — flags anything that is legacy on this Python
    "B",       # bugbear — likely bugs, not just style
    "C4",      # comprehension clarity
    "DTZ",     # naive datetimes; this app stores timestamps
    "T20",     # print / pprint — use a logger instead
    "SIM",     # simplifiable constructs
    "PTH",     # prefer pathlib over os.path
    "RUF",     # ruff's own checks
]

[tool.ruff.lint.isort]
# Without this, the `alembic/` directory in the repo root makes ruff classify
# the installed alembic package as first-party and split its imports across two
# groups.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated from Alembic's template, which emits a trailing
# space after "Revises:" when there is no parent revision, and long revision
# identifiers we do not control.
"alembic/versions/*" = ["E501", "W291"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
