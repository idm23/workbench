name: Guard main

# main must only ever be reached from staging — CLAUDE.md, "main refuses anything
# that is not from staging". Rulesets can require named status checks but cannot
# express "only from branch X" directly, so this job does: it fails, with a
# legible reason, whenever a pull request into main has any head branch but
# staging. Without it such a PR doesn't fail — it sits forever waiting on
# staging-acceptance, a status that can only ever be posted for staging's own
# commits, so the real problem never surfaces as anything but silence.
#
# The promotion PR is opened by promote.yml with the workflow's own
# GITHUB_TOKEN, and GitHub never starts a workflow for an event that token
# caused — so `pull_request` alone left every automatic promotion PR without
# this check, merging regardless. `workflow_dispatch` is the one exception to
# that rule, so promote.yml dispatches this against staging, which attaches
# the check to staging's tip: the promotion PR's head commit.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Reads only event context; never checks out the repository.
permissions: {}

jobs:
  guard:
    name: Only staging may merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that is not staging
        env:
          # head_ref is empty outside pull_request; a dispatch names its ref.
          HEAD: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$HEAD" != "staging" ]; then
            echo "::error::main only accepts pull requests from staging (this one is from '$HEAD')."
            exit 1
          fi
