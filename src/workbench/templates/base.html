<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workbench">
<title>{% block title %}Workbench{% endblock %}</title>
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --fg: #1a1a18;
    --muted: #6b6a63;
    --rule: #d9d7d0;
    --accent: #b45309;
    --danger: #a02c2c;
    --danger-bg: #fbeaea;
    --notice-bg: #fdf3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --panel: #1f1f23;
      --fg: #ececea;
      --muted: #9a9a94;
      --rule: #2e2e33;
      --accent: #f0a868;
      --danger: #f08a8a;
      --danger-bg: #331e1e;
      --notice-bg: #33291a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 34rem;
    margin: 0 auto;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem
             max(2rem, env(safe-area-inset-bottom));
  }
  a { color: inherit; }
  .back {
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    font-size: .9rem;
    margin-bottom: 1rem;
  }
  .back:hover { color: var(--fg); }
  h1 {
    font-size: clamp(1.75rem, 8vw, 2.4rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 .35rem;
    font-weight: 650;
  }
  .sub { color: var(--muted); margin: 0 0 1.75rem; font-size: .95rem; }

  .msg {
    padding: .8rem 1rem;
    border-radius: .5rem;
    margin-bottom: 1.25rem;
    font-size: .95rem;
  }
  .msg.error { background: var(--danger-bg); color: var(--danger); }
  .msg.notice { background: var(--notice-bg); }

  ul.items { list-style: none; margin: 0 0 1.75rem; padding: 0; }
  ul.items li { border-top: 1px solid var(--rule); }
  ul.items li:last-child { border-bottom: 1px solid var(--rule); }
  .row {
    display: block;
    padding: .9rem 0;
    text-decoration: none;
    color: inherit;
  }
  .row-title {
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: baseline;
  }
  .row-meta { color: var(--muted); font-size: .9rem; margin-top: .2rem; }
  .chev { color: var(--muted); font-weight: 400; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .85rem;
  }
  .badge {
    display: inline-block;
    font-size: .75rem;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: .05rem .5rem;
    margin-top: .4rem;
  }
  .empty {
    color: var(--muted);
    border: 1px dashed var(--rule);
    border-radius: .5rem;
    padding: 1.25rem;
    text-align: center;
    margin-bottom: 1.75rem;
    font-size: .95rem;
  }

  form { border-top: 1px solid var(--rule); padding-top: 1.25rem; }
  label {
    display: block;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: .45rem;
  }
  input[type=text] {
    width: 100%;
    padding: .75rem .85rem;
    font-size: 1rem; /* 16px minimum, or iOS zooms on focus */
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--rule);
    border-radius: .5rem;
    margin-bottom: .75rem;
  }
  input[type=text]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .hint { color: var(--muted); font-size: .85rem; margin: -.35rem 0 .75rem; }
  button {
    width: 100%;
    min-height: 2.9rem; /* comfortable tap target */
    padding: .75rem 1rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--bg);
    background: var(--fg);
    border: none;
    border-radius: .5rem;
    cursor: pointer;
  }
  button:active { opacity: .85; }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--rule);
  }
  button.slim { width: auto; min-height: 2.2rem; padding: .35rem .8rem; font-size: .85rem; }
  textarea, select {
    width: 100%;
    padding: .75rem .85rem;
    font: inherit;
    font-size: 1rem; /* as with inputs, below 16px iOS zooms on focus */
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--rule);
    border-radius: .5rem;
    margin-bottom: .75rem;
  }
  textarea { resize: vertical; }

  /* The task tree. Indentation is a left margin driven by depth rather than
     nested <ul>s, so the template iterates one flat list and there is no
     recursive Jinja macro to read. */
  ul.tree { list-style: none; margin: 0 0 1.75rem; padding: 0; }
  ul.tree li { border-top: 1px solid var(--rule); padding: .7rem 0; }
  ul.tree li:last-child { border-bottom: 1px solid var(--rule); }
  .task { display: flex; gap: .6rem; align-items: flex-start; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-weight: 600; overflow-wrap: anywhere; }
  .task.done .task-title { color: var(--muted); text-decoration: line-through; }
  .task-note { color: var(--muted); font-size: .9rem; margin-top: .15rem; }
  .task-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .task-actions form { border: none; padding: 0; margin: 0; }

  /* A checkbox that posts a form. Sized as a tap target first: this is the
     control used most often, and always from a phone. */
  .tick {
    appearance: none;
    flex: 0 0 auto;
    width: 1.35rem; height: 1.35rem;
    margin-top: .1rem;
    border: 1px solid var(--rule);
    border-radius: .35rem;
    background: var(--panel);
    cursor: pointer;
    font-size: .9rem;
    line-height: 1;
    color: var(--fg);
    padding: 0;
    min-height: 0;
  }

  .status {
    display: inline-block;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    border-radius: 999px;
    padding: .1rem .55rem;
    border: 1px solid var(--rule);
    color: var(--muted);
  }
  .status.active { color: var(--accent); border-color: var(--accent); }
  .status.blocked, .status.cancelled { color: var(--danger); border-color: var(--danger); }

  /* Rate limits. Runs bill a subscription, so a window is the thing that
     actually runs out — and it is shared with everything else on the account,
     which is why this sits on every page rather than on a run's own. */
  .limits {
    border: 1px solid var(--rule);
    border-radius: .5rem;
    padding: .6rem .75rem;
    margin-bottom: 1.25rem;
    background: var(--panel);
  }
  .limits-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .75rem;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .07em;
    font-weight: 700;
    color: var(--muted);
  }
  .limits-empty { color: var(--muted); font-size: .85rem; margin: .35rem 0 0; }
  .limit { margin-top: .5rem; }
  .limit-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .75rem;
    font-size: .85rem;
  }
  .limit-name { color: var(--fg); }
  .limit-meta { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  /* A meter rather than a progress bar: this is a measurement against a known
     maximum, not a task advancing, and screen readers say so. */
  .meter {
    display: block;
    width: 100%;
    height: .4rem;
    margin-top: .25rem;
    border-radius: 999px;
    background: var(--rule);
    overflow: hidden;
  }
  .meter > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--muted);
  }
  .limit.warning .meter > span { background: var(--accent); }
  .limit.warning .limit-meta { color: var(--accent); }
  .limit.exhausted .meter > span { background: var(--danger); }
  .limit.exhausted .limit-meta { color: var(--danger); font-weight: 600; }

  /* A task an agent is working on. The dot carries the meaning at a glance and
     the label carries it for anyone the colour does not reach. */
  .pip {
    flex: 0 0 auto;
    width: .5rem;
    height: .5rem;
    border-radius: 999px;
    background: var(--accent);
    display: inline-block;
    margin-right: .35rem;
    vertical-align: middle;
  }
  .status.live { color: var(--accent); border-color: var(--accent); }
  .status.review { color: var(--fg); border-color: var(--fg); }
  .status.pending .pip { background: var(--muted); }
  .status.review .pip { background: var(--fg); }
  .status.live .pip { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .25; }
  }
  /* Someone who has asked for less motion still gets the dot and the label. */
  @media (prefers-reduced-motion: reduce) {
    .status.live .pip { animation: none; }
  }
  .task.busy { }
  .task.busy .task-title { font-weight: 650; }
</style>
</head>
<body>
<div class="wrap">
  {% block back %}{% endblock %}
  {% if error %}<p class="msg error">{{ error }}</p>{% endif %}
  {% if notice %}<p class="msg notice">{{ notice }}</p>{% endif %}
  {% if show_limits %}{% include "_rate_limits.html" %}{% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
